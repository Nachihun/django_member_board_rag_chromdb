# http://IP, http://도메인 → https://도메인
server {
    listen 80 default_server;
    server_name _;
    return 301 https://mydjangorag.shop$request_uri;
}
# https://IP → https://도메인
server {
listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/mydjangorag.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mydjangorag.shop/privkey.pem;
    return 301 https://mydjangorag.shop$request_uri;
}
# 실제 서비스
server {
    listen 443 ssl;
    server_name mydjangorag.shop www.mydjangorag.shop;
    ssl_certificate /etc/letsencrypt/live/mydjangorag.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mydjangorag.shop/privkey.pem;
    client_max_body_size 20M;
    location /static/ { alias /app/staticfiles/; }
    location /media/ { alias /app/media/; }
    location / {
    proxy_pass http://web:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    }
}

